<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>learn-talk：各國小字集語言</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>learn-talk</h1>
  <p class="sub">用很少的字詞學會說話：Mini-Chinese／Mini-English／Mini-French／Mini-Japanese／Mini-Korean</p>
  <div class="langbar">
    <label>語言
      <select id="lang"></select>
    </label>
    <span id="langinfo" class="langinfo"></span>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="translate">翻譯器</button>
  <button class="tab" data-tab="check">檢查器</button>
  <button class="tab" data-tab="speak">唸出來</button>
  <button class="tab" data-tab="lexicon">詞典</button>
  <button class="tab" data-tab="words">詞表</button>
  <button class="tab" data-tab="rules">語法</button>
  <button class="tab" data-tab="expert">LLM 專家</button>
</nav>

<main>
  <!-- 翻譯器 -->
  <section id="tab-translate" class="panel active">
    <div class="row">
      <div class="col">
        <label>受限語言（Mini-X）</label>
        <textarea id="tr-in" rows="10" placeholder="例如：昨天我和朋友一起去買東西。"></textarea>
        <div class="btnrow">
          <button id="tr-check" class="btn">檢查</button>
          <button id="tr-speak" class="btn">🔊 唸出來</button>
        </div>
      </div>
      <div class="col">
        <label>一般語言</label>
        <textarea id="tr-out" rows="10" readonly placeholder="反向翻譯的結果會出現在這裡"></textarea>
        <div class="btnrow">
          <button id="tr-rev" class="btn">反向翻譯</button>
          <button id="tr-out-speak" class="btn">🔊 唸出來</button>
        </div>
      </div>
    </div>
    <div id="tr-result" class="result"></div>
  </section>

  <!-- 檢查器 -->
  <section id="tab-check" class="panel">
    <label>貼一段文字，看它是不是合法的受限語言</label>
    <textarea id="ck-in" rows="8" placeholder="把 Mini-X 的文字貼在這裡"></textarea>
    <div class="btnrow">
      <button id="ck-go" class="btn">檢查</button>
      <button id="ck-file" class="btn">讀檔案</button>
      <input type="file" id="ck-file-input" accept=".txt,.md" hidden>
      <button id="ck-speak" class="btn">🔊 唸出來</button>
    </div>
    <div id="ck-result" class="result"></div>
  </section>

  <!-- 唸出來 -->
  <section id="tab-speak" class="panel">
    <h2>唸出來（文字轉語音）</h2>
    <p class="hint">
      兩種方式：<b>瀏覽器語音</b>（免金鑰、離線可用）與
      <b>伺服器語音</b>（edge-tts，音色較自然，需要本機有 edge-tts）。
    </p>
    <label>要唸的文字</label>
    <textarea id="sp-in" rows="8" placeholder="貼上任何段落"></textarea>
    <div class="btnrow">
      <button id="sp-browser" class="btn">🔊 瀏覽器唸</button>
      <button id="sp-server" class="btn">🔊 伺服器唸（mp3）</button>
      <button id="sp-stop" class="btn">⏹ 停止</button>
      <label class="inline"><input type="range" id="sp-rate" min="0.5" max="1.5" step="0.1" value="1"> 速度</label>
    </div>
    <p class="hint" id="sp-voices"></p>
    <audio id="sp-audio" controls></audio>
    <div class="row2">
      <div class="col">
        <label>中文拼音</label>
        <div id="sp-pinyin" class="pinyin"></div>
      </div>
    </div>
  </section>

  <!-- 詞典 -->
  <section id="tab-lexicon" class="panel">
    <label>查一個詞，看它在受限語言怎麼說</label>
    <div class="btnrow">
      <input type="text" id="lx-q" placeholder="輸入詞（中／英／法／日／韓）">
      <button id="lx-go" class="btn">查</button>
    </div>
    <div id="lx-result" class="result"></div>
  </section>

  <!-- 詞表 -->
  <section id="tab-words" class="panel">
    <div class="btnrow">
      <input type="text" id="wd-q" placeholder="搜尋">
      <select id="wd-cat"><option value="">全部類別</option></select>
      <select id="wd-lv">
        <option value="">全部</option>
        <option value="C">核心層</option>
        <option value="E">擴充層</option>
      </select>
      <button id="wd-speak" class="btn">🔊 唸這一列</button>
    </div>
    <div id="wd-count" class="hint"></div>
    <div id="wd-result" class="words"></div>
  </section>

  <!-- 語法 -->
  <section id="tab-rules" class="panel">
    <h2 id="rules-title">語法規則</h2>
    <div id="rules" class="rules"></div>
  </section>

  <!-- 專家 -->
  <section id="tab-expert" class="panel">
    <div class="btnrow">
      <select id="ex-provider">
        <option value="nvidia">NVIDIA（GLM 5.3 Flash）</option>
        <option value="minimax">MiniMax（M3.1 Flash）</option>
      </select>
      <button id="ex-clear" class="btn">清除對話</button>
    </div>
    <div id="ex-chat" class="chat"></div>
    <div class="btnrow">
      <textarea id="ex-in" rows="3" placeholder="問問題，或請它把中文翻成 Mini-X"></textarea>
      <button id="ex-go" class="btn">送出</button>
    </div>
  </section>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
