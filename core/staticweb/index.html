<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>learn-talk（靜態版・免後端）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>learn-talk</h1>
  <p class="sub" data-i18n="sub"></p>
  <p class="hint" style="margin:-6px 0 10px">靜態版：沒有後端。把自己的 API Key 填在「LLM 專家」分頁上，瀏覽器直接呼叫 LLM（串流）；金鑰只存在這臺電腦的瀏覽器裡。</p>
  <div class="langbar">
    <label><span data-i18n="uiLang"></span>
      <select id="uilang">
        <option value="zh-Hant">繁體中文</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
    </label>
    <label><span data-i18n="learnLang"></span>
      <select id="lang"></select>
    </label>
    <span id="langinfo" class="langinfo"></span>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="expert" data-i18n="tabExpert"></button>
  <button class="tab" data-tab="translate" data-i18n="tabTranslate"></button>
  <button class="tab" data-tab="check" data-i18n="tabCheck"></button>
  <button class="tab" data-tab="speak" data-i18n="tabSpeak"></button>
  <button class="tab" data-tab="lexicon" data-i18n="tabLexicon"></button>
  <button class="tab" data-tab="words" data-i18n="tabWords"></button>
  <button class="tab" data-tab="charset" data-i18n="tabCharset"></button>
  <button class="tab" data-tab="rules" data-i18n="tabRules"></button>
</nav>

<main>
  <!-- 專家 -->
  <section id="tab-expert" class="panel active">
    <div class="btnrow">
      <input type="password" id="ex-key" class="keyinput" placeholder="API Key" autocomplete="off" spellcheck="false">
      <select id="ex-mode">
        <option value="fast" data-i18n="modeFast"></option>
        <option value="strict" data-i18n="modeStrict"></option>
      </select>
      <select id="ex-provider">
        <option value="minimax" selected>MiniMax（M3.1 Flash）</option>
        <option value="nvidia">NVIDIA（GLM 5.3 Flash）</option>
      </select>
      <label class="inline"><input type="checkbox" id="rom-expert" class="rom-toggle" checked> <span data-i18n="romajiLabel"></span></label>
      <label class="inline"><input type="checkbox" id="think-toggle" checked> <span data-i18n="thinkLabel"></span></label>
      <button id="ex-clear" class="btn" data-i18n="exClear"></button>
    </div>
    <div class="btnrow">
      <textarea id="ex-in" rows="3" data-i18n-ph="exInPh"></textarea>
      <button id="ex-go" class="btn" data-i18n="btnSend"></button>
    </div>
    <div id="ex-chat" class="chat"></div>
  </section>

  <!-- 翻譯器 -->
  <section id="tab-translate" class="panel">
    <div class="row">
      <div class="col">
        <label data-i18n="trInLabel"></label>
        <textarea id="tr-in" rows="10" data-i18n-ph="trInPh"></textarea>
        <div class="btnrow">
          <button id="tr-check" class="btn" data-i18n="btnCheck"></button>
          <button id="tr-speak" class="btn" data-i18n="btnSpeak"></button>
        </div>
      </div>
      <div class="col">
        <label data-i18n="trOutLabel"></label>
        <div id="tr-out" class="outblock"></div>
        <div class="btnrow">
          <button id="tr-rev" class="btn" data-i18n="btnReverse"></button>
          <button id="tr-copy" class="btn ghost" data-i18n="copyBtn"></button>
          <button id="tr-out-speak" class="btn" data-i18n="btnSpeak"></button>
          <label class="inline"><input type="checkbox" id="rom-trans" class="rom-toggle" checked> <span data-i18n="romajiLabel"></span></label>
        </div>
      </div>
    </div>
    <div id="tr-result" class="result"></div>
  </section>

  <!-- 檢查器 -->
  <section id="tab-check" class="panel">
    <label data-i18n="ckLabel"></label>
    <textarea id="ck-in" rows="8" data-i18n-ph="ckInPh"></textarea>
    <div class="btnrow">
      <button id="ck-go" class="btn" data-i18n="btnCheck"></button>
      <button id="ck-file" class="btn" data-i18n="btnFile"></button>
      <input type="file" id="ck-file-input" accept=".txt,.md" hidden>
      <button id="ck-speak" class="btn" data-i18n="btnSpeak"></button>
    </div>
    <div id="ck-result" class="result"></div>
  </section>

  <!-- 唸出來 -->
  <section id="tab-speak" class="panel">
    <h2 data-i18n="spTitle"></h2>
    <p class="hint" data-i18n="spHint"></p>
    <label data-i18n="spTextLabel"></label>
    <textarea id="sp-in" rows="8" data-i18n-ph="spInPh"></textarea>
    <div class="btnrow">
      <button id="sp-browser" class="btn" data-i18n="spBrowser"></button>
      <button id="sp-edge" class="btn" data-i18n="spEngineEdge"></button>
      <button id="sp-stop" class="btn" data-i18n="spStop"></button>
      <label class="inline"><span data-i18n="spEngine"></span>
        <select id="sp-engine">
          <option value="browser" data-i18n="spEngineBrowser"></option>
          <option value="edge" data-i18n="spEngineEdge"></option>
        </select></label>
      <label class="inline"><span data-i18n="spRate"></span> <input type="range" id="sp-rate" min="0.5" max="1.5" step="0.1" value="1"></label>
    </div>
    <div class="btnrow" id="sp-tts-row" style="display:none">
      <label class="inline"><span data-i18n="spTtsUrl"></span>
        <input type="text" id="sp-tts-url" class="keyinput" placeholder="http://localhost:8770/api/tts"></label>
    </div>
    <p class="hint" id="sp-voices"></p>
    <audio id="sp-audio" controls></audio>
    <div class="row2">
      <div class="col">
        <label data-i18n="spPinyin"></label>
        <div id="sp-pinyin" class="pinyin"></div>
      </div>
    </div>
  </section>

  <!-- 詞典 -->
  <section id="tab-lexicon" class="panel">
    <label data-i18n="lxLabel"></label>
    <div class="btnrow">
      <input type="text" id="lx-q" data-i18n-ph="lxPh">
      <button id="lx-go" class="btn" data-i18n="btnLookup"></button>
    </div>
    <div id="lx-result" class="result"></div>
  </section>

  <!-- 詞表 -->
  <section id="tab-words" class="panel">
    <div class="btnrow">
      <input type="text" id="wd-q" data-i18n-ph="wdPh">
      <select id="wd-cat"><option value="" data-i18n="wdAllCat"></option></select>
      <select id="wd-lv">
        <option value="" data-i18n="wdAll"></option>
        <option value="C" data-i18n="wdCore"></option>
        <option value="E" data-i18n="wdExt"></option>
      </select>
      <button id="wd-speak" class="btn" data-i18n="btnSpeakRow"></button>
    </div>
    <div id="wd-count" class="hint"></div>
    <div id="wd-result" class="words"></div>
  </section>

  <!-- 字集 -->
  <section id="tab-charset" class="panel">
    <div class="btnrow">
      <span id="cs-count" class="hint"></span>
      <button id="cs-copy" class="btn ghost" data-i18n="csCopy"></button>
    </div>
    <div id="cs-list" class="charset"></div>
  </section>

  <!-- 語法 -->
  <section id="tab-rules" class="panel">
    <h2 id="rules-title"></h2>
    <div id="rules" class="rules"></div>
  </section>

</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
